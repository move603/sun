<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CY RESIZER PRO • Free Unlimited Image Resizer & Converter</title>
<meta name="description" content="The world's most beautiful, fastest, and advanced online image resizer. 100% Client-side.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
colors: {
cy: {
dark: '#050505',
panel: '#0f1014',
panelTrans: 'rgba(15, 16, 20, 0.7)',
primary: '#00f2ea', // Cyan
secondary: '#ff0055', // Neon Pink
accent: '#7000ff', // Purple
text: '#e0e0e0',
muted: '#858b9b'
}
},
fontFamily: {
sans: ['Outfit', 'sans-serif'],
mono: ['Space Grotesk', 'monospace'],
},
animation: {
'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
'float': 'float 6s ease-in-out infinite',
'glow': 'glow 2s ease-in-out infinite alternate',
},
keyframes: {
float: {
'0%, 100%': { transform: 'translateY(0)' },
'50%': { transform: 'translateY(-10px)' },
},
glow: {
'from': { boxShadow: '0 0 10px -5px #00f2ea' },
'to': { boxShadow: '0 0 20px 5px #00f2ea' },
}
}
}
}
}
</script>

<style>
/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0f1014; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #00f2ea; }

/* Glassmorphism Utilities */
.glass {
background: rgba(15, 16, 20, 0.65);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.08);
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

.glass-high {
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Range Slider Styling */
input[type=range] {
-webkit-appearance: none;
width: 100%;
background: transparent;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 16px;
width: 16px;
border-radius: 50%;
background: #00f2ea;
cursor: pointer;
margin-top: -6px;
box-shadow: 0 0 10px #00f2ea;
transition: transform 0.1s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]::-webkit-slider-runnable-track {
width: 100%;
height: 4px;
cursor: pointer;
background: #333;
border-radius: 2px;
}

/* Checkbox Custom */
.cy-checkbox {
appearance: none;
background-color: #1a1c23;
margin: 0;
font: inherit;
color: currentColor;
width: 1.15em;
height: 1.15em;
border: 1px solid #333;
border-radius: 0.15em;
display: grid;
place-content: center;
cursor: pointer;
transition: all 0.2s;
}
.cy-checkbox::before {
content: "";
width: 0.65em;
height: 0.65em;
transform: scale(0);
transition: 120ms transform ease-in-out;
box-shadow: inset 1em 1em #00f2ea;
transform-origin: center;
clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
}
.cy-checkbox:checked { border-color: #00f2ea; }
.cy-checkbox:checked::before { transform: scale(1); }

/* Neon Text */
.text-neon {
text-shadow: 0 0 10px rgba(0, 242, 234, 0.5), 0 0 20px rgba(0, 242, 234, 0.3);
}

/* Background Animation */
#bg-canvas {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
background: radial-gradient(circle at center, #1a1c29 0%, #000000 100%);
}

/* Loader */
.loader {
border: 3px solid rgba(255,255,255,0.1);
border-left-color: #00f2ea;
border-radius: 50%;
width: 24px;
height: 24px;
animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Hide number input arrows */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
-webkit-appearance: none; 
margin: 0; 
}
</style>
</head>
<body class="bg-cy-dark text-cy-text antialiased overflow-x-hidden selection:bg-cy-primary selection:text-black">

<!-- Dynamic Background -->
<canvas id="bg-canvas"></canvas>

<!-- Main Container -->
<div class="relative min-h-screen flex flex-col items-center justify-center p-4 lg:p-8">

    <!-- Header -->
    <header class="w-full max-w-7xl flex justify-between items-center mb-8 animate-float">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cy-primary to-cy-accent flex items-center justify-center shadow-[0_0_15px_rgba(0,242,234,0.4)]">
                <i class="fa-solid fa-layer-group text-black text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold font-mono tracking-tighter text-white">CY <span class="text-cy-primary text-neon">RESIZER</span> PRO</h1>
                <p class="text-xs text-cy-muted tracking-widest uppercase">Ultimate Image Engine</p>
            </div>
        </div>
        <div class="hidden md:flex gap-4">
            <div class="glass px-4 py-2 rounded-full text-xs font-mono text-cy-primary border-cy-primary/30">
                <i class="fa-solid fa-bolt mr-2"></i>100% Client-Side
            </div>
            <div class="glass px-4 py-2 rounded-full text-xs font-mono text-cy-secondary border-cy-secondary/30">
                <i class="fa-solid fa-shield-halved mr-2"></i>Privacy First
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Panel: Upload & List -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- Drop Zone -->
            <div id="drop-zone" class="glass rounded-3xl p-8 border-2 border-dashed border-gray-700 hover:border-cy-primary transition-all duration-300 group relative overflow-hidden cursor-pointer">
                <input type="file" id="file-input" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                <div class="absolute inset-0 bg-cy-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-0"></div>
                
                <div class="relative z-10 flex flex-col items-center justify-center text-center py-10">
                    <div class="w-20 h-20 rounded-full bg-gray-800/50 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-cy-primary group-hover:text-white transition-colors"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">Drop images here</h2>
                    <p class="text-cy-muted mb-6">or click to browse • Supports JPG, PNG, WEBP, AVIF</p>
                    <button class="px-6 py-2 rounded-full bg-gradient-to-r from-cy-primary to-cy-accent text-black font-bold text-sm hover:shadow-[0_0_20px_rgba(0,242,234,0.4)] transition-shadow">
                        SELECT FILES
                    </button>

            </div>

            <!-- Image List -->

                    <h3 class="font-mono text-lg font-bold text-white"><i class="fa-solid fa-images mr-2 text-cy-secondary"></i>Queue <span id="queue-count" class="text-cy-muted text-sm ml-2">(0)</span></h3>
                    <button onclick="clearAll()" class="text-xs text-red-400 hover:text-red-300 transition-colors uppercase tracking-wider font-bold">Clear All</button>
                </div>
                
                <div id="image-list" class="flex-1 overflow-y-auto space-y-3 pr-2 max-h-[500px]">
                    <!-- Empty State -->

                        <i class="fa-regular fa-folder-open text-4xl mb-3"></i>

                    <!-- Items injected here -->
                </div>

        </section>

        <!-- Right Panel: Controls -->
        <section class="lg:col-span-5 flex flex-col gap-6">
            
            <div class="glass rounded-3xl p-6 h-full flex flex-col relative overflow-hidden">
                <!-- Decorative Glow -->

                <div class="flex justify-between items-center mb-6 relative z-10">

                    <button onclick="applyToAll()" class="text-xs bg-gray-800 hover:bg-gray-700 text-white px-3 py-1 rounded-md transition-colors border border-gray-700">

                    </button>
                </div>

                <div class="space-y-6 overflow-y-auto pr-2 custom-scrollbar relative z-10 flex-1">
                    
                    <!-- Resize Mode -->

                        <div class="grid grid-cols-2 gap-2">

                                <button onclick="setPresetScale(100)" class="flex-1 py-1 bg-gray-800 rounded text-xs text-gray-400 hover:bg-gray-700">100%</button>

                            </optgroup>

                                <option value="3840x2160">4K Ultra HD (3840x2160)</option>

                                <option value="image/jpeg">JPEG</option>

                                <option value="image/webp">WebP (Modern)</option>

                            <button onclick="toggleFilter('brightness')" class="filter-btn p-2 rounded-lg bg-gray-800/50 border border-gray-700 hover:border-cy-primary text-gray-400 hover:text-white transition-all" title="Brightness">

                                <input type="checkbox" id="smart-crop" class="cy-checkbox">

                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 pt-6 border-t border-gray-800 space-y-3 relative z-10">
                    <button id="process-btn" onclick="processImages()" class="w-full py-4 rounded-xl bg-gradient-to-r from-cy-primary to-cy-accent text-black font-bold text-lg hover:shadow-[0_0_30px_rgba(0,242,234,0.4)] transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">

                    <div class="grid grid-cols-2 gap-3">

                        </button>
                        <button id="optimize-btn" onclick="optimizeForWeb()" class="py-3 rounded-xl bg-gray-800 text-cy-primary font-medium hover:bg-gray-700 transition-colors border border-gray-700 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-gauge-high"></i> Optimize < 100KB

    <!-- Preview Modal (Hidden by default) -->
    <div id="preview-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" onclick="closePreview()"></div>
        <div class="relative w-full max-w-5xl glass rounded-3xl p-2 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 border-b border-gray-800">

                <button onclick="closePreview()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-auto p-4 flex items-center justify-center bg-black/20 rounded-b-3xl">

            <div class="p-4 border-t border-gray-800 flex justify-between items-center bg-gray-900/50 rounded-b-2xl">
                <div class="text-sm text-gray-400 font-mono" id="preview-info">1920 x 1080 • 250KB</div>
                <button id="preview-download-btn" class="px-6 py-2 bg-cy-primary text-black font-bold rounded-lg hover:bg-cyan-300 transition-colors">
                    Download This

            </div>
        </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 right-8 glass px-6 py-4 rounded-xl transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 border-l-4 border-cy-primary">
        <i class="fa-solid fa-circle-check text-cy-primary"></i>
        <div>
            <h4 class="font-bold text-white text-sm" id="toast-title">Success</h4>
            <p class="text-xs text-gray-400" id="toast-msg">Operation completed.</p>
        </div>
    </div>

</div>

<script>
    // --- State Management ---
    const state = {
        files: [], // { id, originalFile, originalMeta, processedBlob, processedUrl, settings: {} }
        settings: {
            mode: 'percentage', // percentage | dimensions
            scale: 100,
            width: '',
            height: '',
            lockRatio: true,
            format: 'original',
            quality: 85,
            removeExif: true,
            smartCrop: false,
            filters: {
                grayscale: false,
                sepia: false,
                blur: false,
                brightness: false
            },
            rotation: 0
        },
        isProcessing: false
    };

    // --- DOM Elements ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const imageList = document.getElementById('image-list');
    const emptyState = document.getElementById('empty-state');
    const queueCount = document.getElementById('queue-count');
    const processBtn = document.getElementById('process-btn');
    const downloadAllBtn = document.getElementById('download-all-btn');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const previewInfo = document.getElementById('preview-info');

    // --- Event Listeners ---
    
    // Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-cy-primary', 'bg-cy-primary/10');
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-cy-primary', 'bg-cy-primary/10');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-cy-primary', 'bg-cy-primary/10');
        handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // Settings Inputs
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.remove('bg-cy-primary/20', 'border-cy-primary', 'text-cy-primary');
                b.classList.add('bg-gray-800/50', 'border-transparent', 'text-gray-400');
            });
            btn.classList.remove('bg-gray-800/50', 'border-transparent', 'text-gray-400');
            btn.classList.add('bg-cy-primary/20', 'border-cy-primary', 'text-cy-primary');
            
            state.settings.mode = btn.dataset.mode;
            document.getElementById('ctrl-percentage').classList.toggle('hidden', state.settings.mode !== 'percentage');
            document.getElementById('ctrl-dimensions').classList.toggle('hidden', state.settings.mode !== 'dimensions');
        });
    });

    document.getElementById('scale-input').addEventListener('input', (e) => {
        state.settings.scale = parseInt(e.target.value);
        document.getElementById('scale-val').innerText = state.settings.scale + '%';
    });

    document.getElementById('width-input').addEventListener('input', (e) => {
        state.settings.width = e.target.value;
        if(state.settings.lockRatio && state.settings.width) {
            // Calculate height based on first image aspect ratio
            if(state.files.length > 0) {
                const ratio = state.files[0].originalMeta.height / state.files[0].originalMeta.width;
                state.settings.height = Math.round(state.settings.width * ratio);
                document.getElementById('height-input').value = state.settings.height;
            }
        }
    });

    document.getElementById('height-input').addEventListener('input', (e) => {
        state.settings.height = e.target.value;
        if(state.settings.lockRatio && state.settings.height) {
            if(state.files.length > 0) {
                const ratio = state.files[0].originalMeta.width / state.files[0].originalMeta.height;
                state.settings.width = Math.round(state.settings.height * ratio);
                document.getElementById('width-input').value = state.settings.width;
            }
        }
    });

    document.getElementById('quality-input').addEventListener('input', (e) => {
        state.settings.quality = parseInt(e.target.value);
        document.getElementById('quality-val').innerText = state.settings.quality + '%';
    });

    document.getElementById('preset-select').addEventListener('change', (e) => {
        const val = e.target.value;
        if(!val) return;
        const [w, h] = val.split('x');
        state.settings.mode = 'dimensions';
        // Trigger UI update for mode
        document.querySelector('[data-mode="dimensions"]').click();
        
        state.settings.width = w;
        state.settings.height = h;
        document.getElementById('width-input').value = w;
        document.getElementById('height-input').value = h;
    });

    document.getElementById('format-select').addEventListener('change', (e) => {
        state.settings.format = e.target.value;
    });

    document.getElementById('remove-exif').addEventListener('change', (e) => {
        state.settings.removeExif = e.target.checked;
    });

    document.getElementById('smart-crop').addEventListener('change', (e) => {
        state.settings.smartCrop = e.target.checked;
    });

    // --- Core Logic ---

    function handleFiles(fileList) {
        const newFiles = Array.from(fileList).filter(file => file.type.startsWith('image/'));
        
        if(newFiles.length === 0) return;

        let loadedCount = 0;

        newFiles.forEach(file => {
            const id = 'img_' + Date.now() + Math.random().toString(36).substr(2, 9);
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const fileObj = {
                        id,
                        originalFile: file,
                        originalMeta: { width: img.width, height: img.height, size: file.size },
                        processedBlob: null,
                        processedUrl: null,
                        previewUrl: e.target.result
                    };
                    state.files.push(fileObj);
                    addFileToUI(fileObj);
                    loadedCount++;
                    if(loadedCount === newFiles.length) {
                        updateUIState();
                        showToast('Added', `${newFiles.length} images added to queue.`);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function addFileToUI(fileObj) {
        emptyState.classList.add('hidden');
        
        const div = document.createElement('div');
        div.className = 'group flex items-center gap-4 bg-gray-800/30 p-3 rounded-xl border border-gray-800 hover:border-gray-600 transition-all';
        div.id = `item-${fileObj.id}`;
        
        const sizeStr = formatBytes(fileObj.originalMeta.size);
        const dimStr = `${fileObj.originalMeta.width}x${fileObj.originalMeta.height}`;

        div.innerHTML = `
            <div class="w-16 h-16 rounded-lg bg-gray-900 overflow-hidden relative">
                <img src="${fileObj.previewUrl}" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 min-w-0">
                <h4 class="text-white font-medium truncate text-sm">${fileObj.originalFile.name}</h4>
                <div class="flex gap-3 text-xs text-gray-500 font-mono mt-1">
                    <span>${dimStr}</span>
                    <span>${sizeStr}</span>
                </div>
                <div class="status-area mt-2 text-xs font-mono text-cy-primary hidden">
                    <span class="loader inline-block w-3 h-3 mr-1 border-2"></span> Processing...
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <button onclick="previewSingle('${fileObj.id}')" class="w-8 h-8 rounded-full bg-gray-700 text-gray-300 hover:text-white hover:bg-cy-primary hover:text-black transition-all flex items-center justify-center" title="Preview">
                    <i class="fa-regular fa-eye"></i>
                </button>
                <button onclick="removeFile('${fileObj.id}')" class="w-8 h-8 rounded-full bg-gray-700 text-gray-300 hover:text-white hover:bg-red-500 transition-all flex items-center justify-center" title="Remove">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        `;
        imageList.appendChild(div);
    }

    function removeFile(id) {
        state.files = state.files.filter(f => f.id !== id);
        const el = document.getElementById(`item-${id}`);
        if(el) el.remove();
        if(state.files.length === 0) emptyState.classList.remove('hidden');
        updateUIState();
    }

    function clearAll() {
        state.files = [];
        imageList.innerHTML = '';
        imageList.appendChild(emptyState);
        emptyState.classList.remove('hidden');
        updateUIState();
    }

    function updateUIState() {
        queueCount.innerText = `(${state.files.length})`;
        processBtn.disabled = state.files.length === 0 || state.isProcessing;
        downloadAllBtn.disabled = state.files.length === 0 || state.files.every(f => !f.processedBlob);
    }

    // --- Image Processing Engine ---

    async function processImages() {
        if(state.files.length === 0) return;
        
        state.isProcessing = true;
        updateUIState();
        processBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> PROCESSING...';

        const promises = state.files.map(async (fileObj) => {
            updateItemStatus(fileObj.id, true);
            try {
                const result = await processSingleImage(fileObj);
                fileObj.processedBlob = result.blob;
                fileObj.processedMeta = result.meta;
                fileObj.processedUrl = URL.createObjectURL(result.blob);
                updateItemSuccess(fileObj.id);
            } catch (err) {
                console.error(err);
                updateItemError(fileObj.id);
            }
        });

        await Promise.all(promises);

        state.isProcessing = false;
        processBtn.innerHTML = '<i class="fa-solid fa-rocket"></i> PROCESS IMAGES';
        updateUIState();
        showToast('Complete', 'All images processed successfully.');
    }

    async function processSingleImage(fileObj) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // 1. Calculate Dimensions
                    let targetW = img.width;
                    let targetH = img.height;

                    if (state.settings.mode === 'percentage') {
                        const ratio = state.settings.scale / 100;
                        targetW = Math.round(img.width * ratio);
                        targetH = Math.round(img.height * ratio);
                    } else {
                        if (state.settings.width) targetW = parseInt(state.settings.width);
                        if (state.settings.height) targetH = parseInt(state.settings.height);
                        
                        // If only one is provided, calculate the other based on aspect ratio
                        if (state.settings.width && !state.settings.height) {
                            targetH = Math.round(targetW / (img.width / img.height));
                        } else if (!state.settings.width && state.settings.height) {
                            targetW = Math.round(targetH / (img.height / img.width));
                        }
                    }

                    // 2. Rotation (90deg steps)
                    if (state.settings.rotation !== 0) {
                        if (Math.abs(state.settings.rotation) === 90 || Math.abs(state.settings.rotation) === 270) {
                            // Swap width/height for 90/270 rotation
                            [targetW, targetH] = [targetH, targetW];
                        }
                    }

                    canvas.width = targetW;
                    canvas.height = targetH;

                    // 3. Filters & Transformations
                    ctx.save();
                    
                    // Rotation logic
                    ctx.translate(targetW / 2, targetH / 2);
                    ctx.rotate(state.settings.rotation * Math.PI / 180);
                    
                    // Smart Crop (Center Crop) logic
                    let sx = 0, sy = 0, sWidth = img.width, sHeight = img.height;
                    let dx = -targetW / 2, dy = -targetH / 2, dWidth = targetW, dHeight = targetH;

                    if (state.settings.smartCrop) {
                        const sourceRatio = img.width / img.height;
                        const targetRatio = targetW / targetH;

                        if (sourceRatio > targetRatio) {
                            // Source is wider than target: crop sides
                            sWidth = img.height * targetRatio;
                            sx = (img.width - sWidth) / 2;
                        } else {
                            // Source is taller than target: crop top/bottom
                            sHeight = img.width / targetRatio;
                            sy = (img.height - sHeight) / 2;
                        }
                    }

                    // Apply Filters
                    let filterString = '';
                    if(state.settings.filters.grayscale) filterString += 'grayscale(100%) ';
                    if(state.settings.filters.sepia) filterString += 'sepia(100%) ';
                    if(state.settings.filters.blur) filterString += 'blur(2px) ';
                    if(state.settings.filters.brightness) filterString += 'brightness(120%) ';
                    ctx.filter = filterString.trim();

                    ctx.drawImage(img, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight);
                    ctx.restore();

                    // 4. Output Format & Quality
                    let outputType = fileObj.originalFile.type;
                    if (state.settings.format !== 'original') {
                        outputType = state.settings.format;
                    }

                    // Quality only applies to lossy formats
                    let quality = state.settings.quality / 100;
                    if(outputType === 'image/png' || outputType === 'image/bmp' || outputType === 'image/gif') {
                        quality = undefined;
                    }

                    canvas.toBlob((blob) => {
                        if(!blob) {
                            reject(new Error('Canvas to Blob failed'));
                            return;
                        }
                        resolve({
                            blob,
                            meta: { width: targetW, height: targetH, size: blob.size }
                        });
                    }, outputType, quality);

                } catch (e) {
                    reject(e);
                }
            };
            img.onerror = reject;
            img.src = fileObj.previewUrl;
        });
    }

    // --- Helper Functions ---

    function updateItemStatus(id, active) {
        const el = document.getElementById(`item-${id}`);
        if(!el) return;
        const statusArea = el.querySelector('.status-area');
        if(active) statusArea.classList.remove('hidden');
    }

    function updateItemSuccess(id) {
        const el = document.getElementById(`item-${id}`);
        if(!el) return;
        const statusArea = el.querySelector('.status-area');
        statusArea.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> ${formatBytes(state.files.find(f=>f.id===id).processedBlob.size)}`;
        statusArea.classList.remove('hidden');
        
        // Add download button
        const btnContainer = el.querySelector('.flex.flex-col.gap-2');
        const dlBtn = document.createElement('button');
        dlBtn.className = 'w-8 h-8 rounded-full bg-cy-primary text-black hover:bg-white transition-all flex items-center justify-center animate-bounce';
        dlBtn.innerHTML = '<i class="fa-solid fa-download"></i>';
        dlBtn.onclick = () => saveAs(state.files.find(f=>f.id===id).processedBlob, `resized_${state.files.find(f=>f.id===id).originalFile.name}`);
        btnContainer.appendChild(dlBtn);
    }

    function updateItemError(id) {
        const el = document.getElementById(`item-${id}`);
        if(!el) return;
        const statusArea = el.querySelector('.status-area');
        statusArea.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500"></i> Error`;
        statusArea.classList.remove('hidden');
    }

    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    function setPresetScale(val) {
        document.getElementById('scale-input').value = val;
        state.settings.scale = val;
        document.getElementById('scale-val').innerText = val + '%';
    }

    function toggleFilter(filterName) {
        state.settings.filters[filterName] = !state.settings.filters[filterName];
        // Visual feedback on button
        const btns = document.querySelectorAll('.filter-btn');
        btns.forEach(btn => {
            if(btn.getAttribute('onclick').includes(filterName)) {
                if(state.settings.filters[filterName]) {
                    btn.classList.add('bg-cy-primary', 'text-black', 'border-cy-primary');
                    btn.classList.remove('bg-gray-800/50', 'text-gray-400', 'border-gray-700');
                } else {
                    btn.classList.remove('bg-cy-primary', 'text-black', 'border-cy-primary');
                    btn.classList.add('bg-gray-800/50', 'text-gray-400', 'border-gray-700');
                }
            }
        });
    }

    function rotateImage(deg) {
        state.settings.rotation = (state.settings.rotation + deg) % 360;
    }

    // --- Advanced Features ---

    function optimizeForWeb() {
        // Heuristic for "Under 100KB"
        // Set quality to 70, scale to 80% if large, format to WebP
        state.settings.quality = 70;
        document.getElementById('quality-input').value = 70;
        document.getElementById('quality-val').innerText = '70%';
        
        state.settings.format = 'image/webp';
        document.getElementById('format-select').value = 'image/webp';

        if(state.settings.mode === 'percentage' && state.settings.scale > 80) {
            setPresetScale(80);
        }

        showToast('Optimization', 'Settings adjusted for Web (<100KB target).');
    }

    function applyToAll() {
        // Logic is already global, but this could be used to sync individual overrides if we had them.
        // For now, it serves as a confirmation/visual cue.
        showToast('Applied', 'Settings applied to all images.');
    }

    // --- Download & Zip ---

    function downloadZip() {
        const zip = new JSZip();
        let count = 0;

        state.files.forEach(file => {
            if(file.processedBlob) {
                const ext = file.processedBlob.type.split('/')[1];
                zip.file(`resized_${file.originalFile.name.split('.')[0]}.${ext}`, file.processedBlob);
                count++;
            }
        });

        if(count === 0) {
            showToast('Error', 'No processed images to download.');
            return;
        }

        zip.generateAsync({type:"blob"}).then(function(content) {
            saveAs(content, "cy_resizer_pro_images.zip");
        });
    }

    // --- Preview Modal ---

    function previewSingle(id) {
        const file = state.files.find(f => f.id === id);
        if(!file) return;

        // If not processed yet, show original
        const src = file.processedUrl || file.previewUrl;
        const meta = file.processedMeta || file.originalMeta;

        previewImg.src = src;
        previewInfo.innerText = `${meta.width} x ${meta.height} • ${formatBytes(meta.size)}`;
        
        // Setup download button
        const dlBtn = document.getElementById('preview-download-btn');
        if(file.processedBlob) {
            dlBtn.style.display = 'block';
            dlBtn.onclick = () => saveAs(file.processedBlob, `resized_${file.originalFile.name}`);
        } else {
            dlBtn.style.display = 'none';
        }

        previewModal.classList.remove('hidden');
    }

    function closePreview() {
        previewModal.classList.add('hidden');
        previewImg.src = '';
    }

    // --- Toast System ---
    function showToast(title, msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-title').innerText = title;
        document.getElementById('toast-msg').innerText = msg;
        
        toast.classList.remove('translate-y-24', 'opacity-0');
        setTimeout(() => {
            toast.classList.add('translate-y-24', 'opacity-0');
        }, 3000);
    }

    // --- Particle Background Animation ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 2;
            this.color = Math.random() > 0.5 ? '#00f2ea' : '#7000ff';
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = 0.5;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for(let i=0; i<50; i++) particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        
        // Draw connections
        ctx.strokeStyle = '#00f2ea';
        ctx.lineWidth = 0.5;
        for(let i=0; i<particles.length; i++) {
            for(let j=i+1; j<particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 150) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.globalAlpha = 1 - (dist/150);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

</script>
