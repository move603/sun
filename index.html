<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VAKO • Ultimate Image God</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="The last image editor you will ever need.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                    mono: ['JetBrains Mono', 'monospace'],
                    serif: ['Playfair Display', 'serif'],
                },
                colors: {
                    vako: {
                        base: '#050505',
                        panel: 'rgba(20, 20, 23, 0.75)',
                        accent: '#00f0ff', // Cyber Cyan
                        secondary: '#7000ff', // Electric Purple
                        success: '#00ff9d',
                        warning: '#ffae00',
                        danger: '#ff003c',
                    }
                },
                animation: {
                    'spin-slow': 'spin 10s linear infinite',
                    'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    'float': 'float 6s ease-in-out infinite',
                    'glow': 'glow 2s ease-in-out infinite alternate',
                    'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                },
                keyframes: {
                    float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
                    glow: { 'from': { boxShadow: '0 0 10px #00f0ff' }, 'to': { boxShadow: '0 0 20px #00f0ff, 0 0 10px #7000ff' } },
                    shake: { '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' }, '20%, 80%': { transform: 'translate3d(2px, 0, 0)' }, '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' }, '40%, 60%': { transform: 'translate3d(4px, 0, 0)' } }
                }
            }
        }
    }
</script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- JSZip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
    /* --- CORE AESTHETICS --- */
    body {
        background-color: #050505;
        color: #ffffff;
        overflow: hidden; /* App-like feel */
        cursor: none; /* Custom cursor */
    }

    /* --- CUSTOM CURSOR --- */
    #cursor-dot, #cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 99999;
        pointer-events: none;
        mix-blend-mode: difference;
    }
    #cursor-dot { width: 8px; height: 8px; background: white; }
    #cursor-ring { 
        width: 40px; height: 40px; 
        border: 1px solid rgba(255,255,255,0.5); 
        transition: width 0.2s, height 0.2s, background 0.2s;
    }
    body.hovering #cursor-ring { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border-color: transparent; }
    body.brush-mode #cursor-ring { border: 2px solid #00f0ff; width: 30px; height: 30px; }

    /* --- GLASSMORPHISM --- */
    .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    .glass-panel {
        background: rgba(10, 10, 12, 0.85);
        backdrop-filter: blur(24px);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* --- UTILS --- */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .range-slider {
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        outline: none;
    }
    .range-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px; height: 16px;
        border-radius: 50%;
        background: #00f0ff;
        cursor: pointer;
        box-shadow: 0 0 10px #00f0ff;
        transition: transform 0.1s;
    }
    .range-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* --- THEMES --- */
    body.theme-cyberpunk { --accent: #00f0ff; --bg: #050505; }
    body.theme-sakura { --accent: #ffb7b2; --bg: #2a1a1a; }
    body.theme-arctic { --accent: #00f2ff; --bg: #e0f7fa; color: #000; }
    body.theme-dracula { --accent: #ff79c6; --bg: #282a36; }
    
    /* --- CANVAS --- */
    #main-canvas {
        background-image: 
            linear-gradient(45deg, #1a1a1a 25%, transparent 25%), 
            linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), 
            linear-gradient(45deg, transparent 75%, #1a1a1a 75%), 
            linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }

    /* --- ANIMATIONS --- */
    @keyframes ripple {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(4); opacity: 0; }
    }
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: scale(0);
        animation: ripple 0.6s linear;
        pointer-events: none;
    }
</style>
</head>

    <!-- JS LOGIC -->
    <script>
        // --- STATE MANAGEMENT ---
        const state = {
            canvas: document.getElementById('main-canvas'),
            ctx: document.getElementById('main-canvas').getContext('2d'),
            originalImage: null,
            history: [],
            historyIndex: -1,
            zoom: 1,
            tool: 'move',
            isDrawing: false,
            filters: {
                brightness: 0,
                contrast: 0,
                saturation: 0,
                blur: 0,
                hue: 0
            },
            themes: ['cyberpunk', 'sakura', 'arctic', 'dracula'],
            currentTheme: 0
        };

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            initThreeJS();
            initCursor();
            initEasterEggs();
            
            // Resize canvas to container initially
            resizeCanvasContainer();
            window.addEventListener('resize', resizeCanvasContainer);
        });

        // --- CURSOR LOGIC ---
        function initCursor() {
            const dot = document.getElementById('cursor-dot');
            const ring = document.getElementById('cursor-ring');
            
            document.addEventListener('mousemove', (e) => {
                dot.style.left = e.clientX + 'px';
                dot.style.top = e.clientY + 'px';
                
                ring.animate({
                    left: e.clientX + 'px',
                    top: e.clientY + 'px'
                }, { duration: 500, fill: "forwards" });
            });

            document.querySelectorAll('button, input, a, .canvas-container').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        }

        // --- THREE.JS BACKGROUND ---
        function initThreeJS() {
            const container = document.getElementById('three-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Particles
            const geometry = new THREE.BufferGeometry();
            const count = 1000;
            const posArray = new Float32Array(count * 3);
            
            for(let i = 0; i < count * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 20;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.05,
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.8
            });
            
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            
            camera.position.z = 5;

            // Animation
            let mouseX = 0;
            let mouseY = 0;
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX / window.innerWidth - 0.5;
                mouseY = e.clientY / window.innerHeight - 0.5;
            });

            const animate = () => {
                requestAnimationFrame(animate);
                particles.rotation.y += 0.002;
                particles.rotation.x += 0.001;
                
                // Parallax
                particles.rotation.x += mouseY * 0.05;
                particles.rotation.y += mouseX * 0.05;
                
                renderer.render(scene, camera);
            };
            
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- FILE HANDLING ---
        function handleFileUpload(file) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    state.originalImage = img;
                    state.canvas.width = img.width;
                    state.canvas.height = img.height;
                    state.ctx.drawImage(img, 0, 0);
                    
                    // Update UI
                    document.getElementById('upload-overlay').classList.add('opacity-0', 'pointer-events-none');
                    document.getElementById('canvas-dims').innerText = `${img.width} x ${img.height}`;
                    resetZoom();
                    saveHistory();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- DRAWING & EDITING ---
        function setTool(toolName) {
            state.tool = toolName;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active', 'text-white', 'bg-white/10'));
            const activeBtn = document.querySelector(`[data-tool="${toolName}"]`);
            if(activeBtn) activeBtn.classList.add('active', 'text-white', 'bg-white/10');
            
            // Cursor logic
            document.body.classList.remove('brush-mode');
            if (toolName === 'brush' || toolName === 'eraser') {
                document.body.classList.add('brush-mode');
            }
        }

        // Canvas Drawing Logic (Simplified for Single File)
        state.canvas.addEventListener('mousedown', startDrawing);
        state.canvas.addEventListener('mousemove', draw);
        state.canvas.addEventListener('mouseup', stopDrawing);
        state.canvas.addEventListener('mouseout', stopDrawing);

        function startDrawing(e) {
            if (state.tool !== 'brush' && state.tool !== 'eraser') return;
            state.isDrawing = true;
            draw(e);
        }

        function draw(e) {
            if (!state.isDrawing) return;
            
            const rect = state.canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (state.canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (state.canvas.height / rect.height);
            
            state.ctx.lineWidth = 5;
            state.ctx.lineCap = 'round';
            
            if (state.tool === 'eraser') {
                state.ctx.globalCompositeOperation = 'destination-out';
            } else {
                state.ctx.globalCompositeOperation = 'source-over';
                state.ctx.strokeStyle = '#00f0ff';
            }
            
            state.ctx.lineTo(x, y);
            state.ctx.stroke();
            state.ctx.beginPath();
            state.ctx.moveTo(x, y);
        }

        function stopDrawing() {
            if (state.isDrawing) {
                state.isDrawing = false;
                state.ctx.beginPath();
                saveHistory();
            }
        }

        // --- FILTERS & ADJUSTMENTS ---
        function updateFilter(type, value) {
            state.filters[type] = value;
            document.getElementById(`val-${type}`).innerText = value;
            applyFilters();
        }

        function applyFilters() {
            if (!state.originalImage) return;
            
            // Reset
            state.ctx.filter = 'none';
            state.ctx.globalCompositeOperation = 'source-over';
            state.ctx.drawImage(state.originalImage, 0, 0);
            
            // Construct filter string
            const f = state.filters;
            const filterString = `brightness(${100 + parseInt(f.brightness)}%) contrast(${100 + parseInt(f.contrast)}%) saturate(${100 + parseInt(f.saturation)}%) blur(${f.blur}px) hue-rotate(${f.hue}deg)`;
            
            state.ctx.filter = filterString;
            state.ctx.drawImage(state.originalImage, 0, 0);
            state.ctx.filter = 'none'; // Reset for next draw ops
        }

        function applyPreset(name) {
            // Reset sliders
            state.filters = { brightness: 0, contrast: 0, saturation: 0, blur: 0, hue: 0 };
            
            switch(name) {
                case 'grayscale': state.filters.saturation = -100; break;
                case 'sepia': state.ctx.filter = 'sepia(100%)'; break; // Simplified
                case 'cyber': state.filters.contrast = 30; state.filters.saturation = 50; break;
                case 'invert': state.ctx.filter = 'invert(100%)'; break;
            }
            applyFilters();
            saveHistory();
        }

        // --- ZOOM & NAVIGATION ---
        function zoomIn() { state.zoom *= 1.2; updateZoom(); }
        function zoomOut() { state.zoom /= 1.2; updateZoom(); }
        function resetZoom() { state.zoom = 1; updateZoom(); }
        
        function updateZoom() {
            state.canvas.style.transform = `scale(${state.zoom})`;
            document.getElementById('zoom-level').innerText = Math.round(state.zoom * 100) + '%';
        }

        // --- HISTORY (UNDO/REDO) ---
        function saveHistory() {
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }
            state.history.push(state.canvas.toDataURL());
            state.historyIndex++;
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                loadHistory(state.history[state.historyIndex]);
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                loadHistory(state.history[state.historyIndex]);
            }
        }

        function loadHistory(dataUrl) {
            const img = new Image();
            img.onload = () => {
                state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
                state.ctx.drawImage(img, 0, 0);
            };
            img.src = dataUrl;
        }

        // --- EXPORT ---
        function exportImage() {
            const link = document.createElement('a');
            link.download = `VAKO_Masterpiece_${Date.now()}.png`;
            link.href = state.canvas.toDataURL();
            link.click();
            triggerConfetti();
        }

        // --- UTILS ---
        function toggleTheme() {
            document.body.classList.remove(`theme-${state.themes[state.currentTheme]}`);
            state.currentTheme = (state.currentTheme + 1) % state.themes.length;
            document.body.classList.add(`theme-${state.themes[state.currentTheme]}`);
        }

        function switchTab(tabName) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        }

        function triggerConfetti() {
            for(let i=0; i<50; i++) {
                const c = document.createElement('div');
                c.style.position = 'fixed';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-10px';
                c.style.width = '10px';
                c.style.height = '10px';
                c.style.backgroundColor = ['#00f0ff', '#7000ff', '#ff003c'][Math.floor(Math.random()*3)];
                c.style.zIndex = '9999';
                c.style.transition = 'top 2s ease-out, transform 2s linear';
                document.body.appendChild(c);
                setTimeout(() => {
                    c.style.top = '110vh';
                    c.style.transform = `rotate(${Math.random()*360}deg)`;
                }, 10);
                setTimeout(() => c.remove(), 2000);
            }
        }

        // --- AI SIMULATION ---
        function runAI(type) {
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Processing...`;
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                if (type === 'upscale') {
                    alert('AI Upscale: Image resolution doubled (Simulated for Demo)');
                } else if (type === 'remove-bg') {
                    alert('AI Background Removed: Subject isolated (Simulated for Demo)');
                } else if (type === 'auto-fix') {
                    state.filters.contrast = 15;
                    state.filters.saturation = 10;
                    applyFilters();
                    saveHistory();
                }
            }, 1500);
        }

        // --- EASTER EGGS ---
        function initEasterEggs() {
            let keySequence = [];
            document.addEventListener('keydown', (e) => {
                keySequence.push(e.key.toLowerCase());
                if (keySequence.length > 10) keySequence.shift();
                
                if (keySequence.join('').includes('vako')) {
                    document.body.classList.add('animate-shake');
                    triggerConfetti();
                    alert('VAKO MODE ACTIVATED');
                }
                if (keySequence.join('').includes('cymaker')) {
                    alert('Asol Malik Asche! Real Boss Entered!');
                    document.body.style.filter = 'hue-rotate(90deg)';
                }
            });
        }

        function resizeCanvasContainer() {
            // Logic to fit canvas in view if needed
        }
    </script>
</body>
